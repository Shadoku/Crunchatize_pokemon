name: Deploy Built Stage

on:
  push:
    branches:
      - main  # Or any branch you use for releases
      - master
    tags:
      - 'v*'

permissions:
  contents: write
  issues: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node
        uses: actions/setup-node@v2
        with:
          node-version: '21.7.1'

      - name: Confirm CHUB_AUTH_TOKEN is set
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          if [ "${{ secrets.CHUB_AUTH_TOKEN }}" == "" ] || [ "${{ secrets.CHUB_AUTH_TOKEN }}" == "null" ]; then
             echo "Your CHUB_AUTH_TOKEN secret is not set for this project. Cannot proceed."
             exit 1
          fi

      - name: Get or Make Stage ID
        if: ${{ !contains(github.repository, 'template') }}
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
          STAGE_ID: ${{ secrets.STAGE_ID }}
        run: |
          mkdir -p public/       
          touch public/chub_meta.yaml  
          if grep -q "^github_path:" public/chub_meta.yaml; then
            echo "Repo path already in metadata file."
          else
            if [ "${{ github.repository }}" == "CharHubAI/stage-template" ]; then
              echo "Not saving repo name for template project"
            else
              echo "Writing github path 'https://github.com/${{ github.repository }}' to metadata file."
              echo -e "\ngithub_path: 'https://github.com/${{ github.repository }}'\n" >> public/chub_meta.yaml
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"
              git add public/chub_meta.yaml
              git commit -m "Add github_path to chub_meta.yaml" || true
              git push
            fi
          fi
          if [ "${{ secrets.STAGE_ID }}" == "" ]; then
             echo "Secret STAGE_ID does not exist; attempting to read from file"
             STAGE_ID=$(grep '^extension_id:' public/chub_meta.yaml | cut -d ':' -f2 | tr -d " '\"")
             if [ "${STAGE_ID}" == ""  ]; then
                if [ "${{ github.repository }}" == "CharHubAI/stage-template" ]; then
                  echo "Not making ext id for template project"
                  STAGE_ID="extension-template-5523da8cf7de"
                else
                  echo "Extension ID not present in public/chub_meta.yaml extension_id field either. Creating new project."
                  sudo apt-get update
                  sudo apt-get install -y jq
                  STAGE_ID=""
                  # Confirmed NOT relay-able: chub-relay.jake-h.workers.dev returned
                  # "Missing stage ID in path. This endpoint is intended as a relay for
                  # Chub stage deployment." - it only proxies uploads to an existing
                  # extension (/{id}/), not creation of a new one. So this still has to
                  # go straight to chub.ai, which is still blocked from CI/VPN; a valid
                  # extension_id needs to come from somewhere else (e.g. chub.ai's own
                  # website) until that's resolved.
                  HTTP_STATUS=$(curl -s -o creation.json -w "%{http_code}" -H "CH-API-KEY: ${{ secrets.CHUB_AUTH_TOKEN }}" -H "Content-Type: application/json" --request POST --data '{"name":"${{ github.event.repository.name }}"}' https://chub-relay.jake-h.workers.dev/extensions)
                  echo "Stage creation response (HTTP ${HTTP_STATUS}):"
                  cat creation.json
                  echo
                  if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
                    echo "Stage creation request failed with HTTP status ${HTTP_STATUS}."
                    exit 1
                  fi
                  STAGE_ID=$(jq -r '.id_v2 // empty' creation.json)
                  if [ "${STAGE_ID}" == "" ] || [ "${STAGE_ID}" == "null" ]; then
                    echo "Extension ID creation failed; is your CHUB_AUTH_TOKEN secret set for this project?"
                    exit 1
                  fi
                  echo -e "\nextension_id: '${STAGE_ID}'\n" >> public/chub_meta.yaml
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add public/chub_meta.yaml
                  git commit -m "Add new Extension ID to chub_meta.yaml" || true
                  git push
                fi
             else
                echo "Extension ID found in public/chub_meta.yaml."
             fi
          else
             STAGE_ID=${{ secrets.STAGE_ID }}
          fi
          echo "STAGE_ID=${STAGE_ID}" >> $GITHUB_ENV
      - name: Char UUIDGen
        if: ${{ !contains(github.repository, 'template') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-runtime
          if [ -d "public/characters" ]; then
            for file in public/characters/*.yaml; do
              [ -e "$file" ] || continue
              if grep -q 'project_uuid:' "$file"; then
                echo "project has uuid."
              else
                uuid=$(uuidgen)
                echo -e "\nproject_uuid: $uuid\n" >> "$file"
                echo "Added project_uuid to $file"
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"
                git add "$file"
                git commit -m "Add project_uuid to YAML file" || true
                git push
              fi
            done
          fi
      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Zip the build folder
        run: cd dist && zip -r ../build.zip * && cd ../

      - name: Upload the build
        if: ${{ !contains(github.repository, 'template') }}
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          sudo apt-get install -y jq
          # Routed through a third-party relay (not chub.ai directly) as a
          # workaround for chub.ai/Cloudflare rejecting GitHub-runner and VPN
          # IPs outright. This means the relay operator can see the auth
          # token and the build - only kept here because it was explicitly
          # requested; drop back to a direct https://api.chub.ai/extension/...
          # call if that trust tradeoff stops being acceptable.
          HTTP_STATUS=$(curl -s -o upload_response.json -w "%{http_code}" -H "CH-API-KEY: ${{ secrets.CHUB_AUTH_TOKEN }}" -F "file=@build.zip" https://chub-relay.jake-h.workers.dev/extensions/${{ env.STAGE_ID }}/)
          echo "Upload response (HTTP ${HTTP_STATUS}):"
          cat upload_response.json
          echo
          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "Upload failed with HTTP status ${HTTP_STATUS}."
            exit 1
          fi
          if ! jq empty upload_response.json 2>/dev/null; then
            echo "Upload endpoint did not return valid JSON (likely an error page - e.g. chub.ai rejecting the request based on the runner's region). Failing the deploy so this isn't silently swallowed."
            exit 1
          fi

      - name: Setup .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: |
          git config --global user.email "bot@chub.ai"
          git config --global user.name "Chub Bot"
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Extract version from tag
        id: get_version
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        run: echo "::set-output name=VERSION::${GITHUB_REF#refs/tags/v}"
        # Assumes tag is of form v1.0.0, strips the 'v'

      - name: Update package.json version
        run: tsc && yarn pack && yarn publish --new-version ${{ steps.get_version.outputs.VERSION }}
        if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
